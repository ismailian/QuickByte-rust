[package]
name = "quickbyte-cli"
description = "QuickByte Command Line: adds downloads to QuickByte and controls it from a prompt or a script."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "qb"
path = "src/main.rs"

[dependencies]
quickbyte-core.workspace = true
tokio.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
winresource.workspace = true
